<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyra — Personal AI Call Assistant Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --spam: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: rgba(15, 23, 42, 0.9);
      border-right: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
    }

    /* Table Section */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calls-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .calls-table th {
      color: var(--text-muted);
      font-weight: 500;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .calls-table td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      text-transform: uppercase;
    }

    .badge-high { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge-medium { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .badge-low { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .badge-spam { background: rgba(100, 116, 139, 0.2); color: #cbd5e1; }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--primary-hover); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #1e293b;
      width: 600px;
      max-height: 80vh;
      border-radius: 16px;
      padding: 32px;
      border: 1px solid var(--border-color);
      overflow-y: auto;
    }

    .transcript-box {
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-user { color: #38bdf8; }
    .msg-assistant { color: #a7f3d0; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">
      <div class="brand-logo">N</div>
      <div class="brand-title">Nyra AI</div>
    </div>
    <ul class="nav-list">
      <li class="nav-item active">Calls & Activity</li>
      <li class="nav-item">Contacts</li>
      <li class="nav-item">Settings</li>
    </ul>
  </div>

  <div class="main-content">
    <div class="header">
      <h1 class="page-title">Personal Receptionist Dashboard</h1>
      <button class="btn" onclick="fetchStats()">Refresh</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Calls</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">High Priority</div>
        <div class="stat-value" id="stat-high" style="color: var(--danger)">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Callbacks Requested</div>
        <div class="stat-value" id="stat-callbacks" style="color: var(--warning)">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Spam Blocked</div>
        <div class="stat-value" id="stat-spam" style="color: var(--spam)">0</div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <h2>Recent Calls</h2>
      </div>
      <table class="calls-table">
        <thead>
          <tr>
            <th>Caller</th>
            <th>Intent</th>
            <th>Priority</th>
            <th>Callback</th>
            <th>Duration</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="calls-tbody">
          <tr><td colspan="6" style="text-align: center; color: var(--text-muted)">Loading recent calls...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Call Detail Modal -->
  <div class="modal" id="call-modal">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom: 16px;">Call Details</h2>
      <p><strong>Caller:</strong> <span id="modal-caller"></span></p>
      <p><strong>Intent:</strong> <span id="modal-intent"></span></p>
      <p><strong>Summary:</strong> <span id="modal-summary"></span></p>
      <p><strong>Action:</strong> <span id="modal-action"></span></p>

      <div class="transcript-box" id="modal-transcript"></div>

      <button class="btn" style="margin-top: 24px;" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    async function fetchStats() {
      try {
        const res = await fetch('/api/dashboard/stats');
        const data = await res.json();
        document.getElementById('stat-total').innerText = data.total_calls;
        document.getElementById('stat-high').innerText = data.high_priority_calls;
        document.getElementById('stat-callbacks').innerText = data.callbacks_requested;
        document.getElementById('stat-spam').innerText = data.spam_calls;
      } catch (err) {
        console.error(err);
      }
      fetchCalls();
    }

    async function fetchCalls() {
      try {
        const res = await fetch('/api/dashboard/calls');
        const data = await res.json();
        const tbody = document.getElementById('calls-tbody');
        tbody.innerHTML = '';

        if (!data.calls || data.calls.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted)">No call records found.</td></tr>';
          return;
        }

        data.calls.forEach(c => {
          const tr = document.createElement('tr');
          const badgeClass = `badge badge-${c.priority.toLowerCase()}`;
          tr.innerHTML = `
            <td><strong>${c.caller_name}</strong><br><small style="color: var(--text-muted)">${c.phone_number}</small></td>
            <td>${c.intent}</td>
            <td><span class="${badgeClass}">${c.priority}</span></td>
            <td>${c.callback_requested ? 'YES' : 'NO'}</td>
            <td>${c.duration_seconds}s</td>
            <td><button class="btn" onclick="openCallModal('${c.call_id}')">View</button></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function openCallModal(callId) {
      try {
        const res = await fetch(`/api/dashboard/calls/${callId}`);
        const data = await res.json();

        document.getElementById('modal-title').innerText = `Call: ${data.call_id}`;
        document.getElementById('modal-caller').innerText = `${data.caller_name} (${data.phone_number})`;
        document.getElementById('modal-intent').innerText = data.intent;
        document.getElementById('modal-summary').innerText = data.summary;
        document.getElementById('modal-action').innerText = data.requested_action;

        const transcriptBox = document.getElementById('modal-transcript');
        transcriptBox.innerHTML = '<strong>Transcript:</strong>';

        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(m => {
            const div = document.createElement('div');
            div.className = m.role === 'user' ? 'msg-user' : 'msg-assistant';
            div.innerHTML = `<strong>${m.role.toUpperCase()}:</strong> ${m.content}`;
            transcriptBox.appendChild(div);
          });
        } else {
          transcriptBox.innerHTML += '<p style="color: var(--text-muted)">No transcript available.</p>';
        }

        document.getElementById('call-modal').style.display = 'flex';
      } catch (err) {
        console.error(err);
      }
    }

    function closeModal() {
      document.getElementById('call-modal').style.display = 'none';
    }

    fetchStats();
  </script>
</body>
</html>
